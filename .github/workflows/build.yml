name: GitHub CI
on: 
  push:
    branches: [ master ]
    tags:
      - '**'
  workflow_dispatch:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency: 
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  linux_build:
    strategy:
      matrix:
        include:
          - arch: amd64
            artifact: subconverter_linux64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    name: Linux ${{ matrix.arch }} Build
    steps:
    - name: Checkout base
      uses: actions/checkout@v6

    - name: Add commit id into version
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      run: SHA=$(git rev-parse --short HEAD) && sed -i 's/\(v[0-9]\.[0-9]\.[0-9]\)/\1-'"$SHA"'/' src/version.h

    - name: Cache ccache
      uses: actions/cache@v5
      with:
        path: /tmp/ccache
        key: ${{ matrix.arch }}-ccache-${{ hashFiles('src/**/*.cpp', 'src/**/*.h', 'CMakeLists.txt') }}
        restore-keys: |
          ${{ matrix.arch }}-ccache-

    - name: Build
      run: |
        docker run --rm \
          -v $GITHUB_WORKSPACE:/root/workdir \
          -v /tmp/ccache:/root/.ccache \
          -e CCACHE_DIR=/root/.ccache \
          -e CCACHE_MAXSIZE=500M \
          multiarch/alpine:${{ matrix.arch }}-latest-stable \
          /bin/sh -c "
            apk add bash git nodejs npm &&
            cd /root/workdir &&
            chmod +x scripts/build.alpine.release.sh &&
            bash scripts/build.alpine.release.sh
          "

    - name: Upload
      uses: actions/upload-artifact@v6
      with:
        name: ${{ matrix.artifact }}
        path: subconverter/

    - name: Package Release
      if: ${{ github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/') }}
      run: tar czf ${{ matrix.artifact }}.tar.gz subconverter

    - name: Draft Release
      if: ${{ github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/') }}
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ matrix.artifact }}.tar.gz
        draft: true

  docker_build:
    needs: linux_build
    runs-on: ubuntu-latest
    name: Build and Push Docker Image
    if: ${{ github.event_name != 'pull_request' }}
    steps:
    - name: Checkout base
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v5

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v7
      with:
        images: ghcr.io/whua898/subconverter
        tags: |
          type=semver,pattern={{version}}
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Docker login
      uses: docker/login-action@v5
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Get commit SHA
      id: vars
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        platforms: linux/amd64
        context: .
        file: scripts/Dockerfile
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          SHA=${{ steps.vars.outputs.sha_short }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        cache-from: type=gha
        cache-to: type=gha,mode=max